<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; font-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Effectra</title>
<meta name="description" content="Effectra – Projekte, Aufgaben und Fortschritt fürs Team.">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Effectra">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.1/dist/umd/supabase.js" defer></script>
<script src="config.js" defer></script>
<script src="app.js" defer></script>
</head>
<body class="plain">
  <div id="screen" class="shell"><p class="muted" style="text-align:center;margin-top:30vh">Effectra wird geladen …</p></div>

  <div id="app" class="shell" hidden>
    <header class="top">
      <button class="brand" id="ws-btn" type="button" data-action="settings" aria-label="Team und Einstellungen">
        <img class="mark" src="icons/icon-192.png" alt="" width="22" height="22"><span id="ws-name">Effectra</span>
      </button>
      <nav class="nav" aria-label="Bereiche">
        <button class="tab" data-tab="heute" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4L6 18M18 6l1.4-1.4"/></svg>
          <span>Heute</span>
        </button>
        <button class="tab" data-tab="board" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="5" height="16" rx="1.5"/><rect x="10" y="4" width="5" height="10" rx="1.5"/><rect x="17" y="4" width="4" height="13" rx="1.5"/></svg>
          <span>Board</span>
        </button>
        <button class="tab" data-tab="kalender" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
          <span>Kalender</span>
        </button>
        <button class="tab" data-tab="projekte" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7.5A1.5 1.5 0 0 1 4.5 6h4.8l2 2.2h8.2A1.5 1.5 0 0 1 21 9.7v8.8a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 18.5z"/></svg>
          <span>Projekte</span>
        </button>
        <button class="tab" data-tab="team" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14.3c2.1.7 3.5 2.8 3.5 5.7"/></svg>
          <span>Team</span>
        </button>
      </nav>
      <span class="spacer"></span>
      <button class="focus-pill" id="focus-pill" type="button" data-action="focus-pill" hidden></button>
      <button class="search-top" type="button" data-action="palette" aria-label="Schnellsuche (Strg+K)"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M20 20l-4.6-4.6"/></svg><span>Suchen</span><kbd>Strg K</kbd></button>
      <button class="add-top" id="add-top" data-action="new-task" type="button">+ Aufgabe</button>
      <button class="me-btn" id="me-btn" type="button" data-action="settings" aria-label="Einstellungen"></button>
    </header>
    <div class="banner" id="banner" hidden></div>
    <main id="view"></main>
  </div>
  <button class="fab" id="fab" data-action="new-task" type="button" hidden>+ Neue Aufgabe</button>
  <div class="sheet-wrap" id="sheet" hidden></div>
  <div class="pal-wrap" id="palette" hidden></div>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
